name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 提取版本号 ──
      - name: Get version from manifest
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Source version: $VERSION"

          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)                         echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # ── 检查版本是否已发布 ──
      - name: Check if version already released
        id: check
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will create it."
          fi

      # ── 创建 Tag ──
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      # ── 构建发布包 ──
      - name: Build release package
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="EasyCheckUpdate-v${VERSION}.zip"
          PACKAGE_DIR="EasyCheckUpdate"

          mkdir -p "${PACKAGE_DIR}"

          # 复制插件文件
          cp EasyCheckUpdate.js   "${PACKAGE_DIR}/"
          cp manifest.json        "${PACKAGE_DIR}/"

          # 打包
          zip -r "${ZIP_NAME}" "${PACKAGE_DIR}"

          echo "----- Package -----"
          ls -lh "${ZIP_NAME}"
          echo ""
          echo "Contents:"
          unzip -l "${ZIP_NAME}"

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      # ── 生成 Release 说明 ──
      - name: Generate release notes
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) TYPE="🧪 测试版" ;;
            *)                         TYPE="🚀 正式版" ;;
          esac

          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "${TAG}" | head -n1)

          if [ -n "$PREV_TAG" ]; then
            DETAILS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]? | select(.author.login != "github-actions[bot]")] | map("- \(.commit.message | split("\n")[0]) (@\(.author.login))") | join("\n")' \
              2>/dev/null || echo "")

            AUTHORS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]?.author.login // empty] | unique | map(select(. != "github-actions[bot]")) | map("@" + .) | join(" ")' \
              2>/dev/null || echo "")

            CHANGELOG_LINK="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            DETAILS="- 🎉 EasyCheckUpdate v${VERSION} 首次发布"
            AUTHORS=""
            CHANGELOG_LINK=""
          fi

          DETAILS="${DETAILS:-（暂无提交信息）}"
          AUTHORS="${AUTHORS:-（暂无）}"

          cat > /tmp/release_body.md <<BODYEOF
          ## ${TYPE}: EasyCheckUpdate v${VERSION}

          ### 📦 下载 · Downloads

          | 文件 | 说明 |
          |------|------|
          | \`EasyCheckUpdate-v${VERSION}.zip\` | 完整插件包 |

          > 解压后放入 \`plugins/\` 目录即可使用。

          ### 📝 更新内容 · Changes

          ${DETAILS}

          ### 👥 贡献者 · Contributors

          ${AUTHORS}

          ### 🔧 安装 · Installation

          1. 下载 \`EasyCheckUpdate-v${VERSION}.zip\`
          2. 解压到服务器的 \`plugins/\` 目录
          3. 重启服务器或使用 \`ll reload EasyCheckUpdate\` 重载插件

          安装后的目录结构：
          \`\`\`
          plugins/
          └── EasyCheckUpdate/
              ├── EasyCheckUpdate.js
              ├── manifest.json
              ├── tooth.json
              ├── update_versions.json
              └── LICENSE
          \`\`\`
          BODYEOF

          if [ -n "$CHANGELOG_LINK" ]; then
            printf '\n**Full Changelog**: %s\n' "$CHANGELOG_LINK" >> /tmp/release_body.md
          fi

          {
            echo 'body<<BODYEOF'
            cat /tmp/release_body.md
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

          echo "Release notes generated"

      # ── 发布 Release ──
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            ${{ steps.package.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
