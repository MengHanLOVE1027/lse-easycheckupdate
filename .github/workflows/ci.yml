name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & Build Check
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── JSON 语法检查 ──
      - name: Validate JSON files
        shell: bash
        run: |
          for f in manifest.json tooth.json update_versions.json; do
            python3 -m json.tool "$f" > /dev/null
            echo "✅ $f is valid JSON"
          done

      # ── 版本一致性检查 ──
      - name: Check version consistency
        shell: bash
        run: |
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          TOOTH_VER=$(python3 -c "import json; print(json.load(open('tooth.json'))['version'])")
          JS_VER=$(grep -oP 'plugin_version\s*=\s*"\K[^"]+' EasyCheckUpdate.js)
          UPDATE_VER=$(python3 -c "import json; print(json.load(open('update_versions.json'))['latest_version'])")

          echo "manifest.json:      $MANIFEST_VER"
          echo "tooth.json:         $TOOTH_VER"
          echo "EasyCheckUpdate.js: $JS_VER"
          echo "update_versions:    $UPDATE_VER"

          ALL_OK=1
          if [ "$MANIFEST_VER" != "$TOOTH_VER" ]; then
            echo "❌ manifest.json vs tooth.json mismatch!"
            ALL_OK=0
          fi
          if [ "$MANIFEST_VER" != "$JS_VER" ]; then
            echo "❌ manifest.json vs EasyCheckUpdate.js mismatch!"
            ALL_OK=0
          fi
          if [ "$UPDATE_VER" != "$MANIFEST_VER" ]; then
            echo "❌ update_versions.json latest_version mismatch!"
            ALL_OK=0
          fi

          if [ "$ALL_OK" -eq 1 ]; then
            echo "✅ All versions match: $MANIFEST_VER"
          else
            exit 1
          fi

      # ── JS 语法检查 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax
        shell: bash
        run: |
          node --check EasyCheckUpdate.js
          echo "✅ EasyCheckUpdate.js syntax OK"

      # ── 必需文件检查 ──
      - name: Verify required files
        shell: bash
        run: |
          set -e
          for f in EasyCheckUpdate.js manifest.json tooth.json update_versions.json; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f missing"
              exit 1
            fi
          done

      # ── 模拟打包检查 ──
      - name: Verify build structure
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          ZIP_NAME="EasyCheckUpdate-v${VERSION}.zip"
          PACKAGE_DIR="EasyCheckUpdate"

          mkdir -p "${PACKAGE_DIR}"
          cp EasyCheckUpdate.js   "${PACKAGE_DIR}/"
          cp manifest.json        "${PACKAGE_DIR}/"

          zip -r "${ZIP_NAME}" "${PACKAGE_DIR}"

          echo "----- Build result -----"
          ls -lh "${ZIP_NAME}"
          echo ""
          echo "Contents:"
          unzip -l "${ZIP_NAME}"

          echo "✅ Package built successfully: ${ZIP_NAME}"
